<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html, body{
    width:100%;
    height:180px;
    overflow:hidden;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    background:linear-gradient(
        90deg,
        #0b4f2f 0%,
        #16673c 50%,
        #1f7f4c 100%
    );
}

.banner{
    height:180px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:30px;
    padding:0 40px;
}

.logo{
    height:120px;
    width:auto;
    object-fit:contain;
}

.info{
    color:white;
}

.titulo{
    font-size:36px;
    font-weight:700;
    line-height:1.1;
}

.subtitulo{
    font-size:18px;
    opacity:.9;
    margin-top:8px;
    letter-spacing:1px;
}

@media(max-width:768px){

    html, body{
        height:120px;
    }

    .banner{
        height:120px;
        gap:15px;
    }

    .logo{
        height:80px;
    }

    .titulo{
        font-size:22px;
    }

    .subtitulo{
        font-size:12px;
    }
}
</style>
</head>

<body>

<div class="banner">

    <img
        class="logo"
        src="https://raw.githubusercontent.com/vinirondon/maps/484a554247f37ba12d9631060dd4f187985df079/WhatsApp%20Image%202026-05-25%20at%2013.01.04.jpeg"
        alt="DPE MT">

    <div class="info">
        <div class="titulo">
            DEFENSORIA PÚBLICA<br>
            DO ESTADO DE MATO GROSSO
        </div>

        <div class="subtitulo">
            PAINEL ESTRATÉGICO DE INDICADORES
        </div>
    </div>

</div>

</body>
</html>
