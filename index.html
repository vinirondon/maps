<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:80px;
    overflow:hidden;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:linear-gradient(
        90deg,
        #0b4f2f,
        #16673c,
        #1f7f4c
    );
}

.header{
    height:80px;
    display:flex;
    align-items:center;
    padding:0 20px;
}

.logo-container{
    height:58px;
    width:58px;

    background:white;

    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    box-shadow:
        0 4px 12px rgba(0,0,0,.12);

    flex-shrink:0;
}

.logo{
    width:42px;
    height:42px;
    object-fit:contain;
}

.content{
    margin-left:14px;
    color:white;
}

.title{
    font-size:18px;
    font-weight:700;
    line-height:1;
}

.subtitle{
    margin-top:4px;
    font-size:10px;
    letter-spacing:1px;
    opacity:.85;
    text-transform:uppercase;
}
</style>
</head>

<body>

<div class="header">

    <div class="logo-container">
        <img
            class="logo"
            src="https://raw.githubusercontent.com/vinirondon/maps/484a554247f37ba12d9631060dd4f187985df079/WhatsApp%20Image%202026-05-25%20at%2013.01.04.jpeg">
    </div>

    <div class="content">
        <div class="title">
            Defensoria Pública MT
        </div>

        <div class="subtitle">
            Painel Estratégico de Indicadores
        </div>
    </div>

</div>

</body>
</html>
